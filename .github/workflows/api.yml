name: API CI

on:
  push:
    paths:
      - 'api/**'
  pull_request:
    paths:
      - 'api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: api/.python-version

      - run: uv sync

      # NOT a placeholder -- 11 test files, 166 tests currently pass.
      # Still disabled because tests/test_performance.py cannot pass in CI:
      #
      #   6 failing as of 2026-08-21. They encode the pre-9ca97e3 design,
      #   where trade counts, end_date and SPY came from sim_portfolio_snapshots.
      #   9ca97e3 made live SimPortfolio + yfinance the source of truth, so:
      #     - total_trades  now counts sim_positions (5), test expects 6
      #     - end_date      now resolves to today,     test expects 2026-04-04
      #     - spy_value     now a live yfinance fetch, test expects the fixture column
      #
      #   Worse than stale: these tests hit the network (yfinance, unmocked --
      #   test_performance.py patches only DB paths) and two assertions are
      #   date-relative, so they return different values every day. Enabling
      #   this now would ship a gate that is both red AND permanently flaky.
      #
      # To enable: mock yfinance, freeze "today", update the 6 expectations to
      # the post-9ca97e3 behaviour, confirm `uv run pytest` is 172/172, then
      # uncomment. Do not enable by deselecting test_performance.py.
      #
      # - run: uv run pytest
      #   name: Run tests
