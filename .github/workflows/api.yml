name: API CI

on:
  push:
    paths:
      - 'api/**'
  pull_request:
    paths:
      - 'api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: api/.python-version

      - run: uv sync

      # Enabled 2026-08-22. This step was disabled because
      # tests/test_performance.py was red (6 failures) and, worse, hit the
      # network: it called yfinance unmocked and derived assertions from
      # datetime.now(), so it returned different values every day.
      #
      # Both nondeterministic inputs are now pinned at their single seam
      # (src.db.portfolio._fetch_spy_prices and .datetime), and the six
      # expectations were updated to the post-9ca97e3 semantics -- trade counts
      # read live from sim_positions, end_date resolves to today, spy_value is
      # a close price rather than the snapshot's stored return column.
      # Nothing was deselected or skipped to get here: 173 passed, 0 failed.
      - run: uv run pytest
        name: Run tests (11 files, 173 tests)
