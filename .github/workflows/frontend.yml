name: Frontend CI

on:
  # Manual trigger. The path filters below mean this workflow only runs when
  # frontend/** changes -- so a change to this file, or to the test step it
  # runs, cannot prove itself. Its last automatic run was 2026-07-11; the
  # `pnpm test` step added in e333194 had never executed on a runner until
  # this was added.
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm tsc --noEmit
        name: Type check

      - run: pnpm build
        name: Production build (catches vite/router config errors tsc misses)

      - run: pnpm test
        name: Run tests (19 files, 182 tests)
